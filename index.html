<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>

    <div class="logo">
      <img src="./Assets/scaleX.png" alt="scaleX-logo">
      <h3>ScaleX</h3>
    </div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About Us</a>
      <a href="#">Blogs</a>
      <a href="#">Contact Us</a>
    </nav>

    <button class="get-started">Get Started</button>

  </header>

  <main>

    <div class="insights-blog">
      <h1>Insights & Blogs</h1>
    </div>

    <div class="middle-buttons">
      <button>All</button>
      <button>Tech</button>
      <button>SaaS</button>
      <button>Marketing</button>
    </div>

    <div class="bottom">

      <div class="card" id="martinis">
        <div class="pic"></div>
        <button>Tech</button>
        <h3>The Ultimate Guid to <br>  Marketing</h3>
      </div>

      <div class="card" id="chair">
        <div class="pic"></div>
         <button>SaaS</button>
        <h3>5 Key Trends in SaaS Marketing<br>Growth for 2026</h3>
      </div>
      
      <div class="card" id="cat">
        <div class="pic"></div>
         <button>Marketing</button>
        <h3>How Data-Driven Strategies<br>Are Important</h3>
      </div>


    </div>

  </main>
</body>
</html>
